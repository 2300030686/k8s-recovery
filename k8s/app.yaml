apiVersion: v1
kind: Namespace
metadata: {name: wordpress}
---
apiVersion: v1
kind: Secret
metadata: {name: mysql-secret, namespace: wordpress}
stringData: {MYSQL_ROOT_PASSWORD: rootpass, MYSQL_DATABASE: wordpress}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: mysql-pvc, namespace: wordpress}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 1Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: mysql, namespace: wordpress}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: mysql}}
  template:
    metadata:
      labels: {app: mysql}
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        envFrom: [{secretRef: {name: mysql-secret}}]
        ports: [{containerPort: 3306}]
        readinessProbe:
          exec: {command: [sh, -c, "mysqladmin ping -uroot -prootpass"]}
          initialDelaySeconds: 15
          periodSeconds: 5
        volumeMounts: [{name: mysql-data, mountPath: /var/lib/mysql}]
      volumes: [{name: mysql-data, persistentVolumeClaim: {claimName: mysql-pvc}}]
---
apiVersion: v1
kind: Service
metadata: {name: mysql, namespace: wordpress}
spec: {selector: {app: mysql}, ports: [{port: 3306}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: wordpress, namespace: wordpress}
spec:
  replicas: 1
  selector: {matchLabels: {app: wordpress}}
  template:
    metadata: {labels: {app: wordpress}}
    spec:
      containers:
      - name: wordpress
        image: wordpress:6.5-apache
        env:
        - {name: WORDPRESS_DB_HOST, value: mysql}
        - {name: WORDPRESS_DB_USER, value: root}
        - {name: WORDPRESS_DB_PASSWORD, value: rootpass}
        - {name: WORDPRESS_DB_NAME, value: wordpress}
        ports: [{containerPort: 80}]
        readinessProbe: {httpGet: {path: /wp-login.php, port: 80}, initialDelaySeconds: 20, periodSeconds: 5}
---
apiVersion: v1
kind: Service
metadata: {name: wordpress, namespace: wordpress}
spec: {selector: {app: wordpress}, ports: [{port: 80}]}
